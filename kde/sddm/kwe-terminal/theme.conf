[General]
# Directory filled by kwe-sddm-sync (must be readable by the sddm user).
poolDir=/var/lib/kwe-sddm/pool
# Shown when the pool is empty or a clip cannot be decoded.
fallbackColor=#05070a
accent=#33ff66
secondary=#00e5ff
danger=#ff3355
font=Hack
# 0.0 to 1.0: darkening laid over the wallpaper behind the terminal.
dim=0.35
scanlines=true
# Show the picked wallpaper's title in the boot log and top bar.
showWallpaperTitle=true
# Optional: name shown when SDDM does not supply one (preview mode).
#hostname=
